<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Refleksi Mentee</title>
    <meta name="theme-color" content="#1d2f8a">
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            background:
                radial-gradient(circle at 20% 10%, rgba(78, 115, 255, 0.38), transparent 45%),
                #1d2f8a;
            color: #f4f6fb;
        }
        .card {
            width: min(440px, 100%);
            background: rgba(9, 15, 40, 0.86);
            border: 2px solid rgba(255, 255, 255, 0.14);
            border-radius: 26px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
        }
        .emoji { font-size: 3rem; margin-bottom: 10px; }
        h1 { margin: 0 0 10px; font-size: 1.7rem; color: #ffd166; }
        p { margin: 0 0 18px; color: rgba(244, 246, 251, 0.78); line-height: 1.6; }
        button {
            border: 3px solid #0b1140;
            border-radius: 999px;
            padding: 12px 22px;
            background: #ffd166;
            color: #142044;
            font: 700 1rem inherit;
            cursor: pointer;
            box-shadow: 0 8px 0 #0b1140;
        }
        button:active { transform: translateY(2px); box-shadow: 0 5px 0 #0b1140; }
    </style>
</head>
<body>
    <div class="card">
        <div class="emoji">📡</div>
        <h1>Sedang offline</h1>
        <p>Koneksi internet tidak tersedia. Beberapa halaman yang pernah dibuka mungkin masih bisa diakses dari cache.</p>
        <button type="button" onclick="window.location.reload()">Coba lagi</button>
    </div>
</body>
</html>
